# RBY1 termination composition. The base follows a wheel-feasible planar path,
# so horizontal drift and heading are bounded while source/asset root-height
# conventions are intentionally ignored.

defaults:
  - terms/motion_time_out@_here_

_target_: gear_sonic.envs.manager_env.mdp.terminations.TerminationsCfg

anchor_pos_xy:
  _target_: isaaclab.managers.TerminationTermCfg
  func: gear_sonic.envs.manager_env.mdp:exceeded_anchor_pos_xy
  params:
    command_name: motion
    threshold: 0.5

anchor_tilt:
  _target_: isaaclab.managers.TerminationTermCfg
  func: gear_sonic.envs.manager_env.mdp:exceeded_anchor_tilt
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: robot
    command_name: motion
    # For an upright reference this is 1 - cos(tilt); 0.1 corresponds to about
    # 26 degrees. Yaw error is deliberately excluded from this fall detector.
    threshold: 0.1

# Upper-body deviations are already shaped by the body pose/orientation and
# three-point rewards. Terminating on either distal arm before the policy has
# learned the dance caused nearly every rollout to end prematurely.
ee_body_pos: null

foot_pos_xyz:
  _target_: isaaclab.managers.TerminationTermCfg
  func: gear_sonic.envs.manager_env.mdp:exceeded_body_pos
  params:
    command_name: motion
    threshold: 0.3
    body_names: [wheel_l, wheel_r]
