# @package _global_
# SONIC RBY1 config — starter experiment config for the 24-DOF clean RBY1 embodiment.
#
# RBY1-specific actions, rewards, and terminations account for its
# differential-drive base and articulated upper body.

defaults:
  - /algo: ppo_im_phc
  - /manager_env: base_env
  - /callbacks/read_eval
  - /callbacks/im_resample
  - /aux_losses: universal_token/g1_recon_and_all_latent
  - override /trainer: trl_ppo_aux
  - override /actor_critic: universal_token/all_mlp_v1
  - override /manager_env/observations/tokenizer: unitoken_all_noz
  - override /manager_env/observations/policy: local_dir_hist
  - override /manager_env/observations/critic: privileged_mf_hist
  - override /manager_env/events: tracking/level0_4
  - override /manager_env/actions: tracking/rby1
  - override /manager_env/terminations: tracking/rby1_motion
  - override /manager_env/rewards: tracking/rby1_motion

use_manager_env: true

exp_base: ${hydra:runtime.choices.exp}
exp_var: test
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 4096
project_name: TRL_RBY1_Track

actor_prop_history_length: 10
actor_actions_history_length: 10

critic_prop_history_length: 10
critic_actions_history_length: 10

manager_env:
  # Preserve the retargeted CSV exactly during kinematic replay. Enable clipping
  # only when testing articulation safety rather than converter fidelity.
  replay_clip_joint_limits: false
  replay_joint_log: false
  replay_joint_log_post_write: false
  # Used only when replay_clip_joint_limits is enabled. RBY's torso_1..3 are
  # serial pitch joints, so their valid individual limits can still over-bend.
  replay_torso_pitch_limit: 0.6  # radians, aggregate torso pitch
  replay_planar_root: true  # discard source root roll/pitch; preserve heading

  # -------------------------------------------------------------------
  # Event-term overrides
  # -------------------------------------------------------------------
  events:
    # Keep the first RBY1 imitation stage deterministic. The inherited humanoid
    # setup otherwise injects +/-0.5 m/s base velocity at reset, applies another
    # push every 4-6 s, and randomizes wheel/caster friction. Reintroduce those
    # perturbations only after the unperturbed dance is stable.
    physics_material: null
    add_joint_default_pos: null
    base_com: null
    push_robot: null
    randomize_rigid_body_mass: null

  observations:
    tokenizer:
      joint_pos_multi_future_wrist_for_smpl:
        params:
          joints_idx: [12, 13, 14, 19, 20, 21]

  # -------------------------------------------------------------------
  # Reward-term overrides
  # -------------------------------------------------------------------
  rewards:
    # Track articulated upper-body links. Drive-wheel rotation is handled by
    # tracking_wheel_vel rather than quaternion/body-orientation rewards.
    tracking_relative_body_pos:
      params:
        # The previous 0.3 m kernel yielded only ~0.03 reward and stopped
        # shaping the policy once the arms diverged from the reference.
        std: 0.5
        body_names: &rby1_upper_body_reward_links
          [
            "link_torso_1",
            "link_torso_3",
            "link_torso_5",
            "link_left_arm_1",
            "link_left_arm_3",
            "link_left_arm_6",
            "link_right_arm_1",
            "link_right_arm_3",
            "link_right_arm_6",
            "link_head_1",
            "link_head_2",
          ]

    tracking_relative_body_ori:
      params:
        # Preserve a gradient at the roughly one-radian errors seen early in
        # training; this can be tightened after the coarse pose is learned.
        std: 0.8
        body_names: *rby1_upper_body_reward_links

    tracking_body_linvel:
      params:
        body_names: *rby1_upper_body_reward_links

    tracking_body_angvel:
      params:
        body_names: *rby1_upper_body_reward_links

    joint_limit:
      # Hard articulation limits remain enforced by the simulator. Keep this
      # soft-limit cost below the upper-body pose signal during initial imitation.
      weight: -0.5
      params:
        asset_cfg:
          joint_names:
            [
              "torso_.*",
              "left_arm_.*",
              "right_arm_.*",
              "head_.*",
            ]

    # Allow the two drive wheels and four passive caster bodies to contact
    # terrain. Penalize contacts on the base, torso, arms, head, and tools.
    undesired_contacts:
      params:
        sensor_cfg:
          body_names:
            - '^(?!(wheel_l|wheel_r|Cylinder|Cylinder_01|Cylinder_02|Cylinder_03)$).+$'

  # -------------------------------------------------------------------
  # Termination-term overrides
  # -------------------------------------------------------------------
  terminations:
    # Reuse the stock foot position termination as a wheel position termination.
    foot_pos_xyz:
      params:
        body_names:
          [
            "wheel_l",
            "wheel_r",
          ]

  config:
    # The 9-fps trainable clip lasts 12.78 s; leave reset margin after its end.
    episode_length_s: 14.0
    robot:
      type: rby1
    terrain_type: trimesh

  commands:
    motion:
      # USD articulation exposes 28 joints, but the RBY1 motion library is 24-DOF.
      # This activates TrackingCommand's DOF-mismatch path.
      motion_lib_num_dof: 24
      hand_default_positions: [0.0, 0.0, 0.0, 0.0]
      hand_default_velocities: [0.0, 0.0, 0.0, 0.0]
      # Root body in the RBY1 MJCF/URDF.
      anchor_body: "base"

      # Three teleop / VR-style tracking points:
      # distal left arm, distal right arm, upper torso.
      #
      # Offsets are a starting guess:
      # - arm_6 body is proximal to the removed end-effector branch, so -Z offsets
      #   approximate the former tool point in the original RBY1 MJCF.
      # - torso offset approximates an upper-body/head reference point.
      #
      # Visualize these before trusting them.
      vr_3point_body:
        [
          "link_left_arm_6",
          "link_right_arm_6",
          "link_torso_5",
        ]
      vr_3point_body_offset:
        [
          [0.0, 0.0, -0.20],
          [0.0, 0.0, -0.20],
          [0.0, 0.0, 0.25],
        ]

      # Main reward points used by the experiment YAMLs you provided.
      reward_point_body:
        [
          "link_torso_5",
          "link_left_arm_6",
          "link_right_arm_6",
        ]
      reward_point_body_offset:
        [
          [0.0, 0.0, 0.25],
          [0.0, 0.0, -0.20],
          [0.0, 0.0, -0.20],
        ]

      # Preserve a 14-body tracked set analogous in size to SONIC's default command template.
      # RBY1 does not have humanoid legs, so these are a pragmatic first-pass selection:
      # root + wheels + torso chain + representative arm/head bodies.
      body_names:
        [
          "base",
          "wheel_l",
          "wheel_r",
          "link_torso_1",
          "link_torso_3",
          "link_torso_5",
          "link_left_arm_1",
          "link_left_arm_3",
          "link_left_arm_6",
          "link_right_arm_1",
          "link_right_arm_3",
          "link_right_arm_6",
          "link_head_1",
          "link_head_2",
        ]

      num_future_frames: 10
      dt_future_ref_frames: 0.1
      smpl_num_future_frames: 10
      smpl_dt_future_ref_frames: 0.02
      # Train against the verified PKL itself. Pose concatenation and random
      # frame freezing can replace or hold its already-forward torso poses.
      cat_upper_body_poses: false
      freeze_frame_aug: false
      teleop_sample_prob_when_smpl: 0.5

      # A single clip spans the full 14 s episode, so beginning at frame zero
      # provides a stable progression instead of resetting directly into the
      # most strongly leaned frame.
      start_from_first_frame: true
      pose_range:
        x: [-0.01, 0.01]
        y: [-0.01, 0.01]
        z: [0.0, 0.0]
        roll: [-0.02, 0.02]
        pitch: [-0.02, 0.02]
        yaw: [-0.05, 0.05]
      velocity_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [0.0, 0.0]
        roll: [-0.05, 0.05]
        pitch: [-0.05, 0.05]
        yaw: [-0.1, 0.1]
      joint_position_range: [-0.02, 0.02]
      joint_velocity_range: [0.0, 0.0]

      motion_lib_cfg:
        adaptive_sampling:
          adp_samp_failure_rate_max_over_mean: 200

        # Wheel-feasible 12.78 s dance, smoothed so all frame-to-frame joint
        # speeds stay within the configured RBY1 actuator limits.
        motion_file: tmp_rby1_video_compare/guy_dancing_rby1_from_original_bvh_trainable_9fps_smoothed7.pkl

        # Use dummy until matching RBY1 motion keys + SMPL data are available.
        smpl_motion_file: dummy
        smpl_y_up: true

        asset:
          # Use the flattened MJCF here. SONIC's SkeletonTree parser uses Python
          # ElementTree and does not expand MuJoCo <include> tags before searching
          # for <worldbody>, so the skeleton asset must contain worldbody directly.
          assetFileName: "model_v1.2_24dof_clean_flat.xml"

algo:
  config:
    empty_cache_every_n_ppo_epoch: -1
    num_steps_per_env: 24
    use_clampped_std: true
    std_clamp_min: 0.001
    std_clamp_max: 0.5
    max_grad_norm: 0.1

    actor:
      backbone:
        reencode_smpl_g1_recon: true
        encoders:
          g1:
            inputs: ["command_multi_future_nonflat", "motion_anchor_ori_b_mf_nonflat"]
          teleop:
            inputs:
              [
                "command_multi_future_lower_body",
                "vr_3point_local_target",
                "vr_3point_local_orn_target",
                "motion_anchor_ori_b",
              ]
          smpl:
            inputs:
              [
                "smpl_joints_multi_future_local_nonflat",
                "smpl_root_ori_b_multi_future",
                "joint_pos_multi_future_wrist_for_smpl",
              ]
        decoders:
          g1_kin:
            outputs: ["command_multi_future_nonflat", "motion_anchor_ori_b_mf_nonflat"]

    critic:
      backbone:
        module_config_dict:
          layer_config:
            hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
